[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalbox-net"
dynamic = ["version"]
description = "See, check and configure every device of a small office or home network in one place"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"  # CI tests 3.11 (minimum), 3.12, 3.13 and 3.15 (the Docker image)
authors = [{ name = "Philipp Mundhenk" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "cryptography>=43",
  "paho-mqtt>=2.1",
  "asyncssh>=2.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "playwright>=1.47",
  "pytest-playwright>=0.5",
  "amqtt>=0.11",
  "aiosmtpd>=1.4",
  "pywebpush>=2",
  "pysnmp>=7.1,<8",
  "snmpsim>=1.2.2",
  "pysmi>=2,<3",  # snmpsim imports it without declaring it
]
# Apprise URLs as one more notification channel kind (docs/NOTIFICATIONS.md)
apprise = ["apprise>=1.8"]
# Web Push for the browser notification channel (docs/NOTIFICATIONS.md)
webpush = ["pywebpush>=2"]
# Generic read-only SNMP switches (docs/adapters/snmp.md)
snmp = ["pysnmp>=7.1,<8"]
# NETGEAR ProSAFE Plus and TP-Link Easy Smart switches (docs/adr/0003-switchyard-library.md)
switches = [
  "switchyard @ git+https://github.com/PhilippMundhenk/switchyard@4f8e93fd196c408fa45338a45837f61c97cf32a9",
]

[project.scripts]
signalbox = "signalbox.__main__:main"

[project.entry-points."signalbox.adapters"]
adguardhome = "signalbox.adapters.adguardhome:AdGuardHomeAdapter"
easysmart = "signalbox.adapters.plusswitch:EasySmartAdapter"
fritzbox = "signalbox.adapters.fritzbox:FritzboxAdapter"
mikrotik = "signalbox.adapters.mikrotik:MikrotikAdapter"
omada = "signalbox.adapters.omada:OmadaAdapter"
linux = "signalbox.adapters.linux:LinuxAdapter"
openwrt = "signalbox.adapters.openwrt:OpenWrtAdapter"
opnsense = "signalbox.adapters.opnsense:OpnsenseAdapter"
pihole = "signalbox.adapters.pihole:PiholeAdapter"
prosafe = "signalbox.adapters.plusswitch:ProsafeAdapter"
snmp = "signalbox.adapters.snmp:SnmpAdapter"

[project.entry-points."signalbox.rules"]
builtin = "signalbox.rules.builtin:RULES"

[project.urls]
Homepage = "https://github.com/PhilippMundhenk/signalbox"
Issues = "https://github.com/PhilippMundhenk/signalbox/issues"

[tool.hatch.version]
path = "src/signalbox/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true  # the switches extra pins Switchyard by commit

[tool.hatch.build.targets.wheel]
packages = ["src/signalbox"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tools/make_icons.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/signalbox"]
exclude = ["^\\.claude/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paho.*", "switchyard.*", "pysnmp.*", "snmpsim.*", "pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
  "e2e: drives the real UI in a browser",
  "integration: against the real device software (tests/integration, docs/TESTING.md)",
]

[tool.coverage.run]
source = ["signalbox"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]
