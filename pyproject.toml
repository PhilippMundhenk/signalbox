[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalbox-net"
dynamic = ["version"]
description = "See, check and configure every device of a small office or home network in one place"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Philipp Mundhenk" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "cryptography>=43",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "playwright>=1.47",
  "pytest-playwright>=0.5",
  "amqtt>=0.11",
]

[project.scripts]
signalbox = "signalbox.__main__:main"

[project.entry-points."signalbox.adapters"]

[project.entry-points."signalbox.rules"]
builtin = "signalbox.rules.builtin:RULES"

[project.urls]
Homepage = "https://github.com/PhilippMundhenk/signalbox"
Issues = "https://github.com/PhilippMundhenk/signalbox/issues"

[tool.hatch.version]
path = "src/signalbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbox"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/signalbox"]
exclude = ["^\\.claude/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["e2e: drives the real UI in a browser"]

[tool.coverage.run]
source = ["signalbox"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]
