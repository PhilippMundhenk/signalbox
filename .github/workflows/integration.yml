name: Integration

# The adapters against the real device software (#136): one job per target, each boots the
# official software (QEMU with KVM, or a container) and runs tests/integration against it.
# Locally these tests skip; here REQUIRE_INTEGRATION=1 makes a missing target a failure.
# Pull requests start only the targets their changed paths belong to (tools/ci_changes.py, #245);
# main, the schedule and manual runs start all. Require the check `integration-ok`, not the
# per-target jobs: it passes when targets are skipped.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which targets does the change need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      opnsense: ${{ steps.sel.outputs.opnsense }}
      openwrt: ${{ steps.sel.outputs.openwrt }}
      mikrotik: ${{ steps.sel.outputs.mikrotik }}
      omada: ${{ steps.sel.outputs.omada }}
      linux: ${{ steps.sel.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: sel
        run: >
          python3 tools/ci_changes.py integration
          --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          >> "$GITHUB_OUTPUT"

  opnsense:
    needs: changes
    if: needs.changes.outputs.opnsense == 'true'
    name: OPNsense 26.7 (official nano image in QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_INTEGRATION: "1"
      VM_DIR: ${{ github.workspace }}/.vm/opnsense
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and disk tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-utils mtools dosfstools
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the prepared VM
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .vm/opnsense
          # weekly: the preparation installs the newest 26.7.x packages
          key: opnsense-26.7-${{ hashFiles('tools/integration/opnsense/vm.py', 'tools/integration/opnsense/preseed.py', 'tools/integration/opnsense/privileges.json') }}-${{ steps.week.outputs.week }}
      - name: Download and verify the official image
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/integration/opnsense/vm.py fetch "$VM_DIR"
      - name: First boot, update, preseed, API setup
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/integration/opnsense/vm.py prepare "$VM_DIR"
      - name: Save the prepared VM
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vm/opnsense
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Boot the test VM
        run: python3 tools/integration/opnsense/vm.py start "$VM_DIR"
      - name: Automatic setup tests (root's API key, #231)
        # first after the boot: a check run keeps only 50 annotations, and the recording
        # steps fill them; the result is checked at the end of the job
        id: setup
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/integration/test_opnsense_setup_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$VM_DIR/pytest-setup.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$VM_DIR/pytest-setup.log" | cut -c1-3000 | tail -n 80)
              body=${summary//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=OPNsense automatic setup tests failed::$body"
              exit $code
            }
      - name: Record the API answers (read user)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" read
      - name: Record the API answers (write user)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" write
      - name: Record the API answers (Kea, compact rows)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" kea
      - name: Record the API answers (health and time)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" health
      - name: Record the API answers (WireGuard)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" vpn
      - name: Record the API answers (log and flow targets)
        run: python3 tools/integration/opnsense/dump.py "$VM_DIR" logging
      - name: Integration tests
        run: |
          set -o pipefail
          pytest tests/integration/test_opnsense_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$VM_DIR/pytest.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$VM_DIR/pytest.log" | cut -c1-400 | tail -n 80)
              body=$(printf '%s\n--- last lines ---\n%s' "$summary" "$(tail -n 60 "$VM_DIR/pytest.log")")
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=OPNsense integration tests failed::$body"
              exit $code
            }
      - name: Serial console on failure
        if: failure()
        run: |
          body=$(tail -n 60 "$VM_DIR/serial.log" 2>/dev/null | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g')
          body=${body//'%'/'%25'}
          body=${body//$'\n'/'%0A'}
          echo "::error title=OPNsense serial console::$body"
      - name: Automatic setup tests passed
        if: always() && steps.setup.outcome == 'failure'
        run: echo "::error title=OPNsense automatic setup::see the first annotations"; exit 1
      - name: Power off
        if: always()
        run: python3 tools/integration/opnsense/vm.py stop "$VM_DIR" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opnsense-logs
          path: |
            .vm/opnsense/*.log
            .vm/opnsense/api-*.json
          if-no-files-found: ignore
          retention-days: 7

  openwrt:
    needs: changes
    if: needs.changes.outputs.openwrt == 'true'
    name: OpenWrt ${{ matrix.version }} (x86-64 in QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["24.10.8", "25.12.6"]
    env:
      REQUIRE_INTEGRATION: "1"
      # throwaway logins of the test VM, which is only reachable on 127.0.0.1
      IT_OPENWRT_URL: https://127.0.0.1:8443/ubus
      IT_OPENWRT_USER: signalbox
      IT_OPENWRT_PASSWORD: it-read-password
      IT_OPENWRT_WRITE_USER: signalbox-write
      IT_OPENWRT_WRITE_PASSWORD: it-write-password
      IT_OPENWRT_ROOT_PASSWORD: it-root-password
      IT_OPENWRT_SSH_PORT: "8022"
      IT_OPENWRT_VERSION: ${{ matrix.version }}
      IMAGE_DIR: ${{ github.workspace }}/.it/openwrt-image
      RUN_DIR: ${{ github.workspace }}/.it/openwrt-run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils zstd \
            build-essential gawk gettext file rsync unzip wget
      - name: Cache the image
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.IMAGE_DIR }}
          key: openwrt-${{ matrix.version }}-${{ hashFiles('tools/integration/openwrt/**', 'docs/adapters/openwrt.md') }}
      - name: Build the image (official image builder and feeds)
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p .it
          bash tools/integration/openwrt/build-image.sh "${{ matrix.version }}" "$IMAGE_DIR" 2>&1 \
            | tee .it/build.log
          rm -rf "$IMAGE_DIR/downloads"
      - name: Boot OpenWrt
        run: bash tools/integration/openwrt/start-vm.sh "$IMAGE_DIR/openwrt.img" "$RUN_DIR" 8443 8022
      - name: Integration tests
        id: tests
        run: |
          set -o pipefail
          pytest -m integration tests/integration/test_openwrt_real.py -ra --tb=short -p no:cacheprovider \
            -o junit_family=xunit2 --junitxml=.it/openwrt-junit.xml 2>&1 | tee .it/pytest.log
      - name: Automatic setup tests (root over SSH, #231)
        id: setup
        if: success() || steps.tests.outcome == 'failure'
        run: |
          set -o pipefail
          pytest -m integration tests/integration/test_openwrt_setup_real.py -ra --tb=short \
            -p no:cacheprovider 2>&1 | tee .it/pytest-setup.log
      # one step per log: GitHub keeps at most 10 error annotations per step
      - name: "Explain a failure: image build"
        if: failure() && steps.build.outcome == 'failure'
        run: python3 tools/integration/annotate.py .it/build.log "image build" 80
      - name: "Explain a failure: serial console"
        if: failure()
        run: python3 tools/integration/annotate.py "$RUN_DIR/console.log" "serial console" 280
      - name: "Explain a failure: pytest"
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          grep -E '^(FAILED|ERROR)|^E |^tests/.*Error' .it/pytest.log > .it/pytest-errors.log || true
          python3 tools/integration/annotate.py .it/pytest-errors.log "pytest errors" 280
          python3 tools/integration/annotate.py .it/pytest.log "pytest summary" 80
      - name: "Explain a failure: automatic setup"
        if: failure() && steps.setup.outcome == 'failure'
        run: |
          grep -E '^(FAILED|ERROR)|^E |^tests/.*Error' .it/pytest-setup.log > .it/setup-errors.log || true
          python3 tools/integration/annotate.py .it/setup-errors.log "setup errors" 280
      - name: Stop OpenWrt
        if: always()
        run: |
          [ -f "$RUN_DIR/qemu.pid" ] && kill "$(cat "$RUN_DIR/qemu.pid")" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openwrt-${{ matrix.version }}-logs
          path: |
            .it/*.log
            .it/*.xml
            .it/openwrt-run/console.log
          if-no-files-found: ignore
          retention-days: 7

  mikrotik:
    needs: changes
    if: needs.changes.outputs.mikrotik == 'true'
    name: MikroTik RouterOS CHR (official image in QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_INTEGRATION: "1"
      VM_DIR: ${{ github.workspace }}/.vm/mikrotik
      # the check run keeps 50 annotations and the dumps filled them (#331): results and
      # failures need the room
      DUMP_NOTICES: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils
      - name: Restore the prepared VM
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .vm/mikrotik
          # the version is pinned in vm.py: a new version or setup is a new key
          key: mikrotik-chr-${{ hashFiles('tools/integration/mikrotik/vm.py') }}
      - name: Download and verify the official image
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/integration/mikrotik/vm.py fetch "$VM_DIR"
      - name: First boot, admin password, certificate, REST setup
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/integration/mikrotik/vm.py prepare "$VM_DIR"
      - name: Save the prepared VM
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vm/mikrotik
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Boot the test VM
        run: python3 tools/integration/mikrotik/vm.py start "$VM_DIR"
      - name: Automatic setup tests (admin over REST, #231)
        # first after the boot: a check run keeps only 50 annotations, and the recording
        # steps fill them; the result is checked at the end of the job
        id: setup
        continue-on-error: true
        run: |
          set -o pipefail
          pytest tests/integration/test_mikrotik_setup_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$VM_DIR/pytest-setup.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$VM_DIR/pytest-setup.log" | cut -c1-3000 | tail -n 80)
              body=${summary//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=MikroTik automatic setup tests failed::$body"
              exit $code
            }
      - name: Fix it tests (policies over REST, REST service over SSH, #267)
        run: |
          set -o pipefail
          pytest tests/integration/test_mikrotik_fix_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$VM_DIR/pytest-fix.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$VM_DIR/pytest-fix.log" | cut -c1-3000 | tail -n 60)
              body=${summary//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=MikroTik fix-it tests failed::$body"
              exit $code
            }
      - name: Record the REST answers (read user)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" read
      - name: Record the REST answers (read user, DHCP, DNS, clients)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" more
      - name: Record the REST answers (read user, health and time)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" health
      - name: Record the REST answers (read user, uplink)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" uplink
      - name: Record the REST answers (read user, management services)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" services
      - name: Record the REST answers (read user, log and flow targets)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" logging
      - name: Record the REST answers (write user)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" write
      - name: Record the REST answers (refused and missing)
        run: python3 tools/integration/mikrotik/dump.py "$VM_DIR" refused
      - name: Integration tests
        run: |
          set -o pipefail
          pytest tests/integration/test_mikrotik_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$VM_DIR/pytest.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$VM_DIR/pytest.log" | cut -c1-3000 | tail -n 80)
              body=$(printf '%s\n--- last lines ---\n%s' "$summary" "$(tail -n 60 "$VM_DIR/pytest.log")")
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=MikroTik integration tests failed::$body"
              exit $code
            }
      - name: Test results
        if: always()
        run: |
          body=$(grep -E ' (PASSED|FAILED|ERROR|SKIPPED)' "$VM_DIR/pytest.log" 2>/dev/null | sed 's/^tests.integration.test_mikrotik_real.py:://')
          body=${body//'%'/'%25'}
          body=${body//$'\n'/'%0A'}
          echo "::notice title=MikroTik integration test results::$body"
      - name: Collected tests and results in the job summary
        if: always()
        run: |
          {
            echo "### MikroTik integration tests"
            echo
            echo "Collected test ids (what pytest found in the file):"
            echo '```'
            pytest tests/integration/test_mikrotik_real.py --collect-only -q -p no:cacheprovider 2>&1 | grep '::' || true
            echo '```'
            echo
            echo "Outcome per test (from the run above; a test missing here did not run):"
            echo '```'
            grep -E ' (PASSED|FAILED|ERROR|SKIPPED|XFAIL|XPASS)' "$VM_DIR/pytest.log" 2>/dev/null | sed 's/^tests.integration.test_mikrotik_real.py:://' || true
            echo '```'
            echo
            echo "Firewall tests that ran: $(grep -cE 'test_(firewall|adopted|revert_timer).* PASSED' "$VM_DIR/pytest.log" 2>/dev/null || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Serial console on failure
        if: failure()
        run: |
          body=$(tail -n 60 "$VM_DIR/serial.log" 2>/dev/null | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g')
          body=${body//'%'/'%25'}
          body=${body//$'\n'/'%0A'}
          echo "::error title=MikroTik serial console::$body"
      - name: Automatic setup tests passed
        if: always() && steps.setup.outcome == 'failure'
        run: echo "::error title=MikroTik automatic setup::see the first annotations"; exit 1
      - name: Power off
        if: always()
        run: python3 tools/integration/mikrotik/vm.py stop "$VM_DIR" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mikrotik-logs
          path: |
            .vm/mikrotik/*.log
            .vm/mikrotik/api-*.json
          if-no-files-found: ignore
          retention-days: 7

  omada:
    needs: changes
    if: needs.changes.outputs.omada == 'true'
    name: Omada Software Controller 6.3 (official package in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_INTEGRATION: "1"
      CTRL_DIR: ${{ github.workspace }}/.ctrl/omada
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Start the controller
        run: python3 tools/integration/omada/controller.py start "$CTRL_DIR"
      - name: First-start wizard, Open API applications, test site
        run: python3 tools/integration/omada/controller.py setup "$CTRL_DIR"
      - name: Record the API answers (viewer, 1)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" read 0
      - name: Record the API answers (viewer, 2)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" read 1
      - name: Record the API answers (viewer, 3)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" read 2
      - name: Record the API answers (details, 1)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" detail 0
      - name: Record the API answers (details, 2)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" detail 1
      - name: Record the API answers (refusals)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" auth 0
      - name: Record the site services (SSH, SNMP)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" services 0
      - name: Record the spec of the managed devices (1)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" spec 0
      - name: Record the spec of the managed devices (2)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" spec 1
      - name: Record the spec of the managed devices (3)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" spec 2
      - name: Record the gateway ACL and port forwarding API (1)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" firewall 0
      - name: Record the gateway ACL and port forwarding API (2)
        run: python3 tools/integration/omada/dump.py "$CTRL_DIR" firewall 1
      - name: Integration tests
        run: |
          set -o pipefail
          pytest tests/integration/test_omada_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$CTRL_DIR/pytest.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$CTRL_DIR/pytest.log" | cut -c1-1200 | tail -n 40)
              body=$(printf '%s\n--- last lines ---\n%s' "$summary" "$(tail -n 60 "$CTRL_DIR/pytest.log")")
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=Omada integration tests failed::$body"
              exit $code
            }
      - name: Stop
        if: always()
        run: python3 tools/integration/omada/controller.py stop "$CTRL_DIR" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omada-logs
          path: |
            .ctrl/omada/*.log
            .ctrl/omada/api-*.json
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    name: Linux gateway (Debian 12 container with sshd, dnsmasq, chrony, WireGuard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_INTEGRATION: "1"
      TARGET_DIR: ${{ github.workspace }}/.target/linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Start the container, create the read user as documented
        run: python3 tools/integration/linux/target.py start "$TARGET_DIR"
      - name: Integration tests
        run: |
          set -o pipefail
          pytest tests/integration/test_linux_real.py -v -p no:cacheprovider 2>&1 \
            | tee "$TARGET_DIR/pytest.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$TARGET_DIR/pytest.log" | cut -c1-600 | tail -n 60)
              body=$(printf '%s\n--- last lines ---\n%s' "$summary" "$(tail -n 40 "$TARGET_DIR/pytest.log")")
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=Linux integration tests failed::$body"
              exit $code
            }
      - name: A second DHCP server and IPv6 router (dnsmasq in a network namespace, #184)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dnsmasq-base
          bash tools/integration/probe/netns.sh start "$RUNNER_TEMP/probe"
          cat "$RUNNER_TEMP/probe/env" >> "$GITHUB_ENV"
      - name: Probe tests (DHCP as the CI user, the router solicitation as root)
        run: |
          set -o pipefail
          {
            pytest tests/integration/test_probe_real.py -v -p no:cacheprovider &&
            sudo -E env "PATH=$PATH" IT_PROBE_RA=1 "$(command -v python)" -m pytest \
              tests/integration/test_probe_real.py -v -p no:cacheprovider -k router
          } 2>&1 | tee "$TARGET_DIR/pytest-probe.log" || {
              code=$?
              summary=$(grep -E '^(FAILED|ERROR) |^E  ' "$TARGET_DIR/pytest-probe.log" | cut -c1-600 | tail -n 40)
              body=$(printf '%s\n--- dnsmasq ---\n%s' "$summary" "$(tail -n 20 "$RUNNER_TEMP/probe/dnsmasq.log" 2>/dev/null)")
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=Probe integration tests failed::$body"
              exit $code
            }
      - name: Container log on failure
        if: failure()
        run: |
          body=$(docker logs signalbox-linux 2>&1 | tail -n 40)
          body=${body//'%'/'%25'}
          body=${body//$'\n'/'%0A'}
          echo "::error title=Linux container log::$body"
      - name: Stop
        if: always()
        run: |
          python3 tools/integration/linux/target.py stop "$TARGET_DIR" || true
          bash tools/integration/probe/netns.sh stop "$RUNNER_TEMP/probe" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-logs
          path: .target/linux/*.log
          if-no-files-found: ignore
          retention-days: 7

  integration-ok:
    name: Integration (all needed targets passed)
    if: always()
    needs: [changes, opnsense, openwrt, mikrotik, omada, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
