name: CI

# Every push to main and every PR: lint, type check, tests with the coverage gate.
# Browser tests drive the web interface in Chromium; the container smoke test runs the image.
# A `changes` job picks the jobs a PR needs from its paths (tools/ci_changes.py, #245); main runs
# everything. Require the check `ci-ok`: it passes when jobs are skipped. Publishing: release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which jobs does the change need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.sel.outputs.code }}
      docs: ${{ steps.sel.outputs.docs }}
      pythons: ${{ steps.sel.outputs.pythons }}
      e2e: ${{ steps.sel.outputs.e2e }}
      docker: ${{ steps.sel.outputs.docker }}
      home_assistant: ${{ steps.sel.outputs.home_assistant }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: sel
        run: >
          python3 tools/ci_changes.py ci
          --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy

  docs:
    name: Generated docs are current
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - run: >
          pytest -p no:cacheprovider tests/test_docs.py
          tests/test_rules_engine.py::test_every_builtin_rule_is_documented
          tests/test_web.py::test_api_doc_is_current

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.pythons) }}
    env:
      # the switch adapter tests must run, never skip (no SIGNALBOX_ prefix: those are settings)
      REQUIRE_SWITCH_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Tests with the 95 % coverage gate
        # failures as an annotation: the logs cannot always be read
        run: |
          set -o pipefail
          pytest -m "not e2e and not integration" -n auto --cov --cov-report=term-missing \
            --cov-report=xml 2>&1 | tee pytest.log || {
              code=$?
              body=$(grep -E '^(FAILED|ERROR)|^E  |Coverage failure|^TOTAL' pytest.log | cut -c1-600 | tail -n 40)
              body=${body//'%'/'%25'}
              body=${body//$'\n'/'%0A'}
              echo "::error title=Tests failed::$body"
              exit $code
            }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  home-assistant:
    needs: changes
    if: needs.changes.outputs.home_assistant == 'true'
    name: Discovery messages pass Home Assistant's schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install homeassistant -e .
      - run: python tools/validate_ha_discovery.py

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signalbox:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health, login refused/ok, demo devices, findings, non-root)
        run: SKIP_BUILD=1 IMAGE=signalbox:smoke bash tools/smoke.sh

  ci-ok:
    name: CI (all needed jobs passed)
    if: always()
    needs: [changes, lint, docs, test, e2e, home-assistant, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
