name: CI

# Every push to main and every PR: lint, type check, tests with the coverage gate.
# Browser tests drive the web interface in Chromium; the container smoke test runs the image.
# Publishing: release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      # the switch adapter tests must run, never skip (no SIGNALBOX_ prefix: those are settings)
      REQUIRE_SWITCH_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with the 95 % coverage gate
        run: pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,switches]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  home-assistant:
    name: Discovery messages pass Home Assistant's schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install homeassistant -e .
      - run: python tools/validate_ha_discovery.py

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signalbox:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health, login refused/ok, demo devices, findings, non-root)
        run: SKIP_BUILD=1 IMAGE=signalbox:smoke bash tools/smoke.sh
